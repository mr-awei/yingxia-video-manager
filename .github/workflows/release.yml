# CI 流水线（四合一）：
#
# 【模式 A — PR 校验】朋友/协作者开 PR 到 main 时触发：
#   Checkout → Setup Node → npm ci → Typecheck → Build renderer & main
#   （不签名、不打包、不发 Release；合并前能看到「这 PR 能过 TS + 能 build」）
#
# 【模式 B — 发版构建】push 带 v* 的 tag 时触发：
#   跑完 Typecheck + Build 之后，再加三步：签名打包 → GitHub Release → 同步 Gitee Release
#
# 【模式 C — 手动触发】Actions 页点 Run workflow（workflow_dispatch），跑完整发版构建（tag=手动）
#
# 【模式 D — push 到 main 自动校验】信任朋友后，朋友本地合完冲突 → 直接 git push origin main：
#   自动触发 Typecheck + Build（绿色=过、红色=错），立刻能看出朋友推的代码有没有坏；
#   签名/打包/发版仍只在 v* tag 时做（不重复产安装包、不花 CI 额度）
#
# 使用方式（本地只推代码，不再手动打包/上传）：
#   1. bump package.json 版本 + 更新 CHANGELOG
#   2. git commit && git tag vX.Y.Z
#   3. git push 双端（GitHub + Gitee）
#   → 本 workflow 自动完成：构建安装包 → 签名 → 上传 GitHub Release → 同步 Gitee Release
#
# 需要的 GitHub Actions Secrets（仓库 Settings → Secrets and variables → Actions）：
#   CERT_PASSWORD : build/yingxia-sign.pfx 的证书密码（本地导入该证书时设置的密码）
#   GITEE_TOKEN   : Gitee 私人令牌（用于创建 Gitee Release）
# 说明：签名证书 build/yingxia-sign.pfx 本身在仓库里（本地构建也在用）；
#       密码走 Secret，不落仓库。
name: build-release

on:
  push:
    tags:
      - 'v*'
    branches: [main]         # 模式 D：push 到 main 自动校验（朋友合完冲突直接推 main，无需作者审核也能跑 CI）
                              #         仅 Typecheck + Build；签名/打包/发版仍只在 v* tag 时做（env.DO_RELEASE=false）
  pull_request:             # 模式 A：PR 校验（分支合并前）
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:      # 模式 C：手动点触发（跑完整发版流程，tag=手动）
    inputs:
      do_release:
        description: '是否执行签名打包 & Release（默认 true）；false 只做 Typecheck+Build 校验'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

# 同一个 PR 后续 push 时取消前一次还在跑的 workflow（省 CI 时长）
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write
    # 判定「是否执行签名打包 + Release」：
    #   - push v* tag → true
    #   - workflow_dispatch 且 do_release=true → true
    #   - pull_request → false（只校验，不签名不发布，CERT_PASSWORD/GITEE_TOKEN 对 PR 默认也不可用）
    env:
      DO_RELEASE: >-
        ${{
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.do_release == 'true')
        }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer & main
        run: npm run build

      # PR 模式（DO_RELEASE=false）会走到这里就输出成功并结束，绿色打勾 → PR 可合并
      - name: PR 模式：仅校验（跳过签名/打包/发布）
        if: env.DO_RELEASE == 'false'
        run: |
          Write-Host "✅ PR 校验通过（Typecheck + Build 均成功）。当前分支：${env:GITHUB_HEAD_REF} → main"
          Write-Host "如需正式发版：打 vX.Y.Z tag push，或 Actions 页 Run workflow（do_release=true）"
        shell: pwsh

      - name: Package installer (electron-builder, signed)
        # certificateFile/certificatePassword 走 Secret，签名配置不进仓库
        # 证书显式传参（密码走 CSC_KEY_PASSWORD env，不落仓库）
        if: env.DO_RELEASE == 'true'
        run: npx electron-builder --win --config.win.certificateFile=build/yingxia-sign.pfx --publish never
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload installer to GitHub Release
        # 上传 release/*.exe 到本次 tag 对应的 GitHub Release（自动创建）
        # 注意：workflow_dispatch 没有 tag → 不会有 release 名；改用 untagged 模式
        if: env.DO_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: false
          # 从 CHANGELOG.md 顶部取最近一个版本段作为正文
          body_path: CHANGELOG.md
          fail_on_unmatched_files: false
          # 没有 tag 时也允许创建一个 draft（手动触发场景）
          draft: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Sync Gitee Release (link only, Gitee has no CI)
        # Gitee 无 CI 服务，无法自动构建；从 GitHub Release 拉取产物链接同步到 Gitee Release 正文
        if: env.DO_RELEASE == 'true'
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # push v* tag 才需要同步；workflow_dispatch 没有 tag，直接跳过
          if [ "${TAG:0:1}" != "v" ]; then
            echo "::notice::本次非 tag push（$TAG），跳过 Gitee Release 同步"
            exit 0
          fi
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::GITEE_TOKEN 未配置，跳过 Gitee Release 同步（GitHub Release 已发布）"
            exit 0
          fi
          ASSET="YingXia-Setup-${TAG#v}-x64.exe"
          DOWNLOAD_URL="https://github.com/mr-awei/yingxia-video-manager/releases/download/${TAG}/${ASSET}"
          BODY="自动构建（GitHub Actions）已生成安装包：${TAG}

          > Gitee 无 CI 服务，安装包由 GitHub Actions 构建并托管在 GitHub Release。Gitee 附件上限 100MB，以下载链接方式提供：

          [⬇️ 下载 ${ASSET}](<${DOWNLOAD_URL}>)

          或访问发布页：https://github.com/mr-awei/yingxia-video-manager/releases/tag/${TAG}"

          BODY="$BODY" GITEE_TOKEN="$GITEE_TOKEN" TAG="$TAG" \
            python -c "
          import json, os
          payload = {
            'access_token': os.environ['GITEE_TOKEN'],
            'tag_name': os.environ['TAG'],
            'name': os.environ['TAG'],
            'body': os.environ['BODY'],
            'target_commitish': 'main',
            'prerelease': False,
          }
          open('.gitee_rel.json', 'w', encoding='utf-8').write(json.dumps(payload, ensure_ascii=False))
          "
          # 创建；若 tag 已存在则 PATCH 更新正文
          OUT=$(curl -sS -X POST -H "User-Agent: yingxia" -H "Content-Type: application/json;charset=UTF-8" \
            -d @.gitee_rel.json "https://gitee.com/api/v5/repos/mr-awei/yingxia-video-manager/releases" || true)
          if echo "$OUT" | grep -q '"id"'; then
            echo "Gitee Release created for ${TAG}"
          else
            echo "$OUT" | head -c 300
            echo ""
            echo "::warning::Gitee Release 创建失败（可能已存在），尝试 PATCH 更新正文"
            RID=$(curl -sS -H "User-Agent: yingxia" \
              "https://gitee.com/api/v5/repos/mr-awei/yingxia-video-manager/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" \
              | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
            if [ -n "$RID" ]; then
              curl -sS -X PATCH -H "User-Agent: yingxia" -H "Content-Type: application/json;charset=UTF-8" \
                -d @.gitee_rel.json "https://gitee.com/api/v5/repos/mr-awei/yingxia-video-manager/releases/${RID}" || true
              echo "Gitee Release ${TAG} updated"
            fi
          fi
          rm -f .gitee_rel.json
