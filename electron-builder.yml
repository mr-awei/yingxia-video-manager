appId: com.local.videomanager
productName: 影匣
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - CHANGELOG.md
  - CHANGELOG.en.md
  - from: src/main/assets/通用评分与简介规范.md
    to: 通用评分与简介规范.md
  - from: src/main/assets/AV_Scoring_and_Synopsis_Guide_EN.md
    to: AV_Scoring_and_Synopsis_Guide_EN.md
  - from: build/icon.png
    to: icon.png

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 影匣
  deleteAppDataOnUninstall: false
  differentialPackage: false
